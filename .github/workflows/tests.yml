name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install CPU PyTorch for Windows tests
        if: runner.os == 'Windows'
        run: python -m pip install "torch>=2.4,<3" torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Compile Python sources
        run: python -m compileall -q app lavocado_packaging scripts tests main.py

      - name: Check architecture contracts
        run: python -m unittest tests.test_architecture_contracts -v

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
