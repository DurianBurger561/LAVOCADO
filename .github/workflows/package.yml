name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package for ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            archive: LAVOCADO-Windows.zip
          - os: macos-latest
            label: macOS
            archive: LAVOCADO-macOS.zip
          - os: ubuntu-latest
            label: Linux
            archive: LAVOCADO-Linux.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build native application
        run: python -m PyInstaller --noconfirm --clean lavocado.spec

      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/LAVOCADO -DestinationPath LAVOCADO-Windows.zip

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/LAVOCADO.app LAVOCADO-macOS.zip

      - name: Archive Linux application
        if: runner.os == 'Linux'
        run: tar -C dist -czf LAVOCADO-Linux.tar.gz LAVOCADO

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: LAVOCADO-${{ matrix.label }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7
