name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package for ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            spec: lavocado.spec
            dist: dist/LAVOCADO
            executable: dist/LAVOCADO/LAVOCADO.exe
            archive: LAVOCADO-Windows.zip
            artifact: LAVOCADO-Windows
          - os: macos-latest
            label: macOS
            spec: lavocado.spec
            dist: dist/LAVOCADO.app
            executable: dist/LAVOCADO.app/Contents/MacOS/LAVOCADO
            archive: LAVOCADO-macOS.zip
            artifact: LAVOCADO-macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install user dependencies
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install CPU PyTorch for Windows packages
        if: runner.os == 'Windows'
        run: python -m pip install "torch>=2.4,<3" torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Windows user dependencies with CPU PyTorch
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Download and verify all bundled models
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/download_models.py --model all

      - name: Load all required models offline
        env:
          HF_HUB_OFFLINE: "1"
        run: python scripts/verify_model_runtime.py

      - name: Collect licenses and dependency sources
        run: python scripts/collect_release_legal.py

      - name: Build native application
        run: python -m PyInstaller --noconfirm --clean ${{ matrix.spec }}

      - name: Verify unused Polars runtime was excluded
        run: >-
          python -c "from pathlib import Path;
          hits=[str(path) for path in Path('dist').rglob('*') if 'polars' in path.name.lower()];
          assert not hits, f'Unexpected Polars files: {hits[:10]}'"

      - name: Run frozen offline self-check
        shell: bash
        run: '"${{ matrix.executable }}" --self-check'

      - name: Verify bundled dashboard resources
        run: >-
          python -c "from pathlib import Path;
          expected={'index.html','styles.css','i18n.js','app.js'};
          found={path.name for path in Path('dist').rglob('*') if path.parent.name == 'web'};
          missing=expected-found;
          assert not missing, f'Missing dashboard resources: {sorted(missing)}'"

      - name: Verify all bundled model files and digests
        run: python scripts/verify_model_bundle.py "${{ matrix.dist }}"

      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.dist }}" -DestinationPath ${{ matrix.archive }}

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          choco upgrade innosetup -y --no-progress
          $version = $env:REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d') { $version = '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" lavocado_packaging\windows_installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist-installer\LAVOCADO-Windows-Setup.exe LAVOCADO-Windows-Setup.exe

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath .\LAVOCADO-Windows-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\LAVOCADO\LAVOCADO.exe'
          if (-not (Test-Path $exe)) { throw "LAVOCADO.exe was not installed" }
          $check = Start-Process -FilePath $exe -ArgumentList '--self-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Installed self-check failed with $($check.ExitCode)" }

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "${{ matrix.dist }}" ${{ matrix.archive }}

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            LAVOCADO-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Download packaged applications
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix=LAVOCADO/ HEAD -o release/LAVOCADO-Source.zip
          sha256sum release/* > release/SHA256SUMS.txt
          ls -l release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            PRE=""
            case "$TAG" in *-*) PRE="--prerelease" ;; esac
            gh release create "$TAG" release/* --title "LAVOCADO $TAG" --notes-file docs/releases/v1.0.4.md $PRE
          fi
